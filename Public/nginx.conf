# ═══════════════════════════════════════════════════════════════
# DocInspector — Nginx Configuration
# ── Serves static HTML/CSS/JS directly
# ── Proxies /api/* requests to Flask (port 5000)
# ── Ready for SSL (Let's Encrypt certbot)
# ═══════════════════════════════════════════════════════════════

# ── Rate limiting zones ────────────────────────────────────────
# Limits API abuse: max 30 requests/minute per IP for /api/process
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=bundle_limit:10m rate=10r/m;

# ── HTTP → HTTPS redirect (uncomment when SSL is ready) ───────
# server {
#     listen 80;
#     server_name doc-inspector.com www.doc-inspector.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;  # uncomment for HTTPS
    server_name doc-inspector.com www.doc-inspector.com localhost;

    # SSL certs (uncomment when certbot is set up)
    # ssl_certificate     /etc/letsencrypt/live/doc-inspector.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/doc-inspector.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    root /usr/share/nginx/html;
    charset utf-8;

    # ── Security headers ───────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Max upload size (50 MB per file × multiple files) ─────
    client_max_body_size 200M;
    client_body_timeout  120s;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── Static files — direct serve by Nginx (fastest) ────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Language sub-directories ──────────────────────────────
    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }
    location /ro/ {
        try_files $uri $uri/ /ro/index.html;
    }
    location /ru/ {
        try_files $uri $uri/ /ru/index.html;
    }

    # ── Root redirect to /en/ ─────────────────────────────────
    location = / {
        return 301 /en/;
    }

    # ── API proxy → Flask/gunicorn ────────────────────────────
    # All /api/* requests go to the Python server
    location /api/ {
        # Rate limiting (uncomment to enable)
        # limit_req zone=api_limit burst=10 nodelay;

        proxy_pass         http://docinspector:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for large file processing
        proxy_read_timeout    180s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    180s;

        # Buffer settings for large file uploads
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ── Health check endpoint ─────────────────────────────────
    location = /health {
        proxy_pass http://docinspector:5000/api/status;
    }

    # ── Default fallback ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /en/index.html;
    }

    # ── Deny access to sensitive files ────────────────────────
    location ~ /\.(git|env|py|pyc|log|sh) {
        deny all;
        return 404;
    }
    location ~* (server\.py|requirements\.txt|Dockerfile|docker-compose) {
        deny all;
        return 404;
    }
}
