# ═══════════════════════════════════════════════════════════════
# DocInspector — docker-compose.yml
# Environments:
#   LOCAL TEST  : docker compose up
#   PRODUCTION  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════

services:
  docinspector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docinspector_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent temp dir (optional — auto-cleanup handles this anyway)
      - docinspector_tmp:/app/tmp_processing
      # Hot-reload server.py during LOCAL development (comment out in prod)
      - ./server.py:/app/server.py:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=4
      - MAX_CONTENT_LENGTH=52428800   # 50 MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits (important on VPS)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M

  # ── Nginx reverse proxy ──────────────────────────────────────
  # Handles HTTPS termination, serves static HTML/CSS/JS files,
  # and proxies /api/* to the Flask server
  nginx:
    image: nginx:1.25-alpine
    container_name: docinspector_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./en:/usr/share/nginx/html/en:ro
      - ./ro:/usr/share/nginx/html/ro:ro
      - ./ru:/usr/share/nginx/html/ru:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./i18n-dict.js:/usr/share/nginx/html/i18n-dict.js:ro
      - ./i18n.js:/usr/share/nginx/html/i18n.js:ro
      - ./scroll-fx.js:/usr/share/nginx/html/scroll-fx.js:ro
      - ./hero-office.js:/usr/share/nginx/html/hero-office.js:ro
      - ./cookies.js:/usr/share/nginx/html/cookies.js:ro
      # SSL certs (Let's Encrypt via certbot — see setup guide)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      docinspector:
        condition: service_healthy

volumes:
  docinspector_tmp:
    driver: local
